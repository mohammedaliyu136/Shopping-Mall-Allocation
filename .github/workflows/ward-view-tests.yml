name: Ward View tests

on:
  push:
    branches: [main, master]
    paths: ['ward-view/**', '.github/workflows/ward-view-tests.yml']
  pull_request:
    paths: ['ward-view/**', '.github/workflows/ward-view-tests.yml']

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ward-view
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    name: Ward View · PHP ${{ matrix.php }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pdo, pdo_sqlite, sqlite3
          coverage: none
      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: Code style
        run: vendor/bin/pint --test
      - name: Tests
        run: php artisan test

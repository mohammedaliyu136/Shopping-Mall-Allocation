name: Tests

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']

    name: PHP ${{ matrix.php }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          # The application deliberately avoids ext-bcmath; money arithmetic is
          # handled in integer minor units by App\Support\Money.
          extensions: dom, curl, libxml, mbstring, zip, pdo, pdo_sqlite, sqlite3, gd
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.lock') }}

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare the application
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Check code style
        run: ./vendor/bin/pint --test

      - name: Run tests
        run: php artisan test

      - name: Verify migrations and seeders run on a clean database
        run: |
          touch database/database.sqlite
          php artisan migrate:fresh --seed --no-interaction
